<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Busca de Produto</title>
    <link rel="stylesheet" href="styles/style.css">
    <script defer src="scripts/exBuscaAPI.js"></script>
</head>
<body>
    <div class="container">
        <h1>Buscar cliente pelos dados</h1>
        <label for="codigo">Código:</label>
        <input type="text" id="codigo" placeholder="Digite o código do usuário">
        <button id="buscar">Buscar</button>
        <form class="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome completo">
            <label for="rg">RG:</label>
            <input type="text" id="rg" placeholder="Digite o RG">
            <label for="nascimento">Nascimento:</label>
            <input type="text" id="nascimento" placeholder="Digite o nascimento">
        </form>
    </div>
</body>
</html>
